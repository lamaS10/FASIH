{% extends "main/base.html" %}
{% load static %}

{% block title %}إنشاء جلسة{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/create_session.css' %}">
{% endblock %}

{% block content %}

<section class="session-hero">
    <h1>إنشاء جلسة</h1>
    <p>
        إنشاء جلسة استشارية أو علاجية
    </p>
</section>

<section class="session-content">
    <div class="session-card">

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>نوع الجلسة</label>
                <select name="session_type" required>
                    <option value="">-- اختر نوع الجلسة --</option>
                    <option value="INITIAL">جلسة استشارية (أولى)</option>
                    <option value="TREATMENT">جلسة علاجية</option>
                </select>
            </div>

            <div class="form-group">
                <label>عنوان الجلسة</label>
                <input type="text" name="title" required>
            </div>

            <div class="form-group">
                <label>رقم ملف المريض</label>
                <input
                    type="text"
                    value="{{ patient.file_number }}"
                    readonly
                >
            </div>

            <div class="form-group">
                <label>وقت بداية الجلسة</label>
                <input
                    type="datetime-local"
                    name="start_time"
                    id="start_time"
                    required
                >
            </div>

            <div class="form-group">
                <label>وقت نهاية الجلسة</label>
                <input
                    type="datetime-local"
                    name="end_time"
                    id="end_time"
                    required
                >
            </div>

            <button type="submit" class="btn-primary">
                إنشاء الجلسة
            </button>
        </form>

    </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const startInput = document.getElementById("start_time");
    const endInput = document.getElementById("end_time");

    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    const minDateTime = now.toISOString().slice(0, 16);

    startInput.min = minDateTime;
    endInput.min = minDateTime;

    startInput.addEventListener("change", function () {
        endInput.min = startInput.value;

        if (endInput.value && endInput.value <= startInput.value) {
            endInput.value = "";
        }
    });
});
</script>

{% endblock %}
